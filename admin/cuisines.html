<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>

<body>

<div class="admin-layout">

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-brand">

            <div class="brand-icon">
                <i class="fa-solid fa-utensils"></i>
            </div>

            <div>
                <h2>AI Cooking</h2>
                <span>Admin Panel</span>
            </div>

        </div>

        <nav class="sidebar-nav">

            <a href="index.html" class="nav-item">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Dashboard</span>
            </a>

            <a href="recipes.html" class="nav-item">
                <i class="fa-solid fa-book-open"></i>
                <span>Recipes</span>
            </a>

            <a href="users.html" class="nav-item">
                <i class="fa-solid fa-users"></i>
                <span>Users</span>
            </a>

            <a href="submissions.html" class="nav-item">
                <i class="fa-solid fa-file-circle-check"></i>
                <span>Submissions</span>
            </a>

            <a href="states.html" class="nav-item">
                <i class="fa-solid fa-map-location-dot"></i>
                <span>States</span>
            </a>

            <a href="districts.html" class="nav-item">
                <i class="fa-solid fa-location-dot"></i>
                <span>Districts</span>
            </a>

            <a href="festivals.html" class="nav-item">
                <i class="fa-solid fa-calendar-days"></i>
                <span>Festivals</span>
            </a>

            <a href="cuisines.html" class="nav-item active">
                <i class="fa-solid fa-bowl-food"></i>
                <span>Cuisines</span>
            </a>

            <a href="analytics.html" class="nav-item">
                <i class="fa-solid fa-chart-line"></i>
                <span>Analytics</span>
            </a>

        </nav>

    </aside>


    <main class="main-content">

        <header class="admin-header">

            <button
                class="menu-button"
                id="sidebarToggle"
            >
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="header-title">

                <h1>Cuisines</h1>

                <p>
                    Manage cooking cuisines.
                </p>

            </div>

        </header>


        <section class="page-content">

            <div class="page-heading">

                <div>

                    <h2>Cuisine Management</h2>

                    <p>
                        Indian and international cuisines.
                    </p>

                </div>

            </div>


            <div class="panel">

                <div
                    class="table-wrapper"
                    id="cuisinesContainer"
                >

                    <div class="empty-state">
                        Loading cuisines...
                    </div>

                </div>

            </div>

        </section>

    </main>

</div>


<div id="toastContainer" class="toast-container"></div>

<script src="admin.js"></script>


<script>

async function loadCuisines() {

    const container =
        document.getElementById(
            "cuisinesContainer"
        );

    try {

        const response =
            await fetch(
                "../data/cuisines.json"
            );

        const cuisines =
            await response.json();


        container.innerHTML = `

            <table class="admin-table">

                <thead>

                    <tr>
                        <th>Cuisine</th>
                        <th>Region</th>
                        <th>Description</th>
                    </tr>

                </thead>

                <tbody>

                    ${cuisines.map(
                        cuisine => `

                        <tr>

                            <td>
                                <strong>
                                    ${escapeHTML(
                                        cuisine.name
                                    )}
                                </strong>
                            </td>

                            <td>
                                <span class="badge badge-info">
                                    ${escapeHTML(
                                        cuisine.region ||
                                        "-"
                                    )}
                                </span>
                            </td>

                            <td>
                                ${escapeHTML(
                                    cuisine.description ||
                                    "-"
                                )}
                            </td>

                        </tr>

                    `
                    ).join("")}

                </tbody>

            </table>

        `;

    } catch (error) {

        container.innerHTML = `
            <div class="empty-state">
                Unable to load cuisines.
            </div>
        `;

    }

}


function escapeHTML(value) {

    return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


loadCuisines();

</script>

</body>
</html>
